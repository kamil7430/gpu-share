type: object
required:
  - reviewId
  - orderId
  - authorUsername
  - rating
  - createdAt
properties:
  reviewId:
    type: integer
    description: The unique identifier of the review.
    example: 1
  orderId:
    type: string
    description: The unique identifier of the associated order.
    example: "456"
  authorUsername:
    type: string
    description: Username of the user who wrote the review.
    example: "user1"
  rating:
    type: integer
    minimum: 1
    maximum: 5
    description: The rating score given by the user.
    example: 5
  comment:
    type: string
    description: Feedback details.
    example: "Great device"
  createdAt:
    type: string
    format: date-time
    description: The timestamp when the review was created.
    example: "2026-06-06T12:00:00Z"
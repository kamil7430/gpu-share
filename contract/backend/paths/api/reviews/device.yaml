get:
  summary: Get reviews for a specific device
  description: Returns a list of all reviews associated with a specific device.
  operationId: getReviewsByDeviceId
  parameters:
    - name: deviceId
      in: path
      required: true
      description: The unique identifier of the device to fetch reviews for.
      schema:
        type: string
        example: "456"
    - $ref: "../../../parameters/query/limit.yaml"
  responses:
    "200":
      description: A list of device reviews retrieved successfully.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../schemas/Review.yaml"
    "404":
      description: Not Found. The specified deviceId does not exist in the system.
    default:
      $ref: "../../../responses/default.yaml"